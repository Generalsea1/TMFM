name: Build TMFM Radio

on:
  push:
    branches:
      - "main"
      - "production/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/cmdline-tools.zip" | sha256sum -c -
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline
          mv /tmp/android-cmdline/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Lint debug build
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -f "$APK"
          "$AAPT" dump badging "$APK" > /tmp/tmfm-badging.txt
          grep -F "application-label:'TMFM'" /tmp/tmfm-badging.txt
          ! grep -qi "deba" /tmp/tmfm-badging.txt
          sha256sum "$APK"
          stat -c "APK_BYTES=%s" "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.generalsea1.tmfm'"

      - name: Verify bundled Internet streams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence
          : > docs/evidence/stream-verification.txt
          names=( "Mix FM 87.8" "Radio Hits 88.2" "Nogoum FM 100.6" "Mega FM 92.7" "Sha3by FM 95.0" )
          urls=(
            "https://stream-29.zeno.fm/na3vpvn10qruv"
            "https://radiohits882.radioca.st/;"
            "https://stream.zeno.fm/qb1zvsykm98uv"
            "https://megafm927.radioca.st/stream"
            "https://radio95.radioca.st/;"
          )
          for i in "${!urls[@]}"; do
            name="${names[$i]}"
            url="${urls[$i]}"
            echo "=== $name ===" | tee -a docs/evidence/stream-verification.txt
            echo "URL=$url" | tee -a docs/evidence/stream-verification.txt
            if curl --fail --location --silent --show-error --max-time 15 --head "$url" >/tmp/tmfm-head.txt; then
              echo "HEAD=PASS" | tee -a docs/evidence/stream-verification.txt
            else
              echo "HEAD=NOT_SUPPORTED; FALLING_BACK_TO_GET" | tee -a docs/evidence/stream-verification.txt
              curl --fail --location --silent --show-error --max-time 15 --range 0-65535 -D /tmp/tmfm-get-headers.txt -o /tmp/tmfm-first-bytes.bin "$url"
              test -s /tmp/tmfm-first-bytes.bin
              echo "GET_INITIAL_BYTES=PASS" | tee -a docs/evidence/stream-verification.txt
              sed -n '1,12p' /tmp/tmfm-get-headers.txt | tee -a docs/evidence/stream-verification.txt
            fi
            ffprobe -v error -rw_timeout 12000000 -show_entries stream=codec_name,codec_type,bit_rate -of default=noprint_wrappers=1 "$url" | tee -a docs/evidence/stream-verification.txt
            timeout 20s ffmpeg -hide_banner -loglevel error -i "$url" -t 8 -af volumedetect -f null - 2>/tmp/tmfm-volumedetect.txt
            cat /tmp/tmfm-volumedetect.txt | tee -a docs/evidence/stream-verification.txt
            grep -E "mean_volume:|max_volume:" /tmp/tmfm-volumedetect.txt >/dev/null
            echo "DECODE_8S=PASS" | tee -a docs/evidence/stream-verification.txt
          done

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmfm-radio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
